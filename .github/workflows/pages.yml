name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron runs on UTC. Singapore is UTC+8.
    - cron: "0 0 * * 2-6"     # 8:00 AM SGT, Tue-Sat: US session that just closed
    - cron: "0 13 * * 1-5"    # 9:00 PM SGT, Mon-Fri: before the US open (9:30 PM SGT, 10:30 PM in US winter time)
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - name: Refresh the S&P 500 list, prices, news and company numbers
        # Yahoo sometimes rate-limits CI machines. Each script refuses to write a poor file, so a failed
        # part keeps (and publishes) the last committed one. News is a different Yahoo service, so it
        # runs alongside the price download. Company numbers change slowly: at most once a day.
        continue-on-error: true
        run: |
          pip install -r requirements-refresh.txt
          python universe.py || echo "::warning::could not refresh the S&P 500 list; keeping sp500.csv"
          python news.py & news_pid=$!
          python export_web.py --refresh || echo "::warning::price refresh failed; keeping the last data.json"
          python fundamentals.py --max-age-hours 20 || echo "::warning::fundamentals refresh failed; keeping the last file"
          wait $news_pid || echo "::warning::news refresh failed; keeping the last news.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record today's picks for the Scoreboard
        # Appends the app's default picks to site/picks_log.json (one per price date). It stops, rather than
        # overwrite, if the log is damaged, so the history is never lost.
        continue-on-error: true
        run: node tools/snapshot_picks.mjs site

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain site sp500.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json site/news.json site/fundamentals.json site/picks_log.json sp500.csv
            git commit -m "Refresh price and news data"
            git push
          fi

      - name: Password-protect the site
        # Encrypts everything in site/ into dist/ (see tools/protect.mjs). Fails, and so publishes
        # nothing, if the MARKET_PASSWORD secret is missing or shorter than 12 characters.
        env:
          MARKET_PASSWORD: ${{ secrets.MARKET_PASSWORD }}
        run: node tools/protect.mjs site dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
