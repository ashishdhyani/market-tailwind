name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron runs on UTC. Singapore is UTC+8.
    - cron: "0 0 * * 2-6"     # 8:00 AM SGT, Tue-Sat: US session that just closed
    - cron: "0 13 * * 1-5"    # 9:00 PM SGT, Mon-Fri: before the US open (9:30 PM SGT, 10:30 PM in US winter time)
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - name: Refresh prices from Yahoo Finance
        # Yahoo sometimes rate-limits CI machines. export_web.py refuses to write a partial
        # file, so on failure we keep (and deploy) the last committed data.json.
        continue-on-error: true
        run: |
          pip install -r requirements-refresh.txt
          python export_web.py --refresh

      - name: Refresh news headlines
        # Independent of prices: if Yahoo's feeds fail, news.py exits without touching news.json.
        continue-on-error: true
        run: |
          pip install -r requirements-refresh.txt
          python news.py

      - name: Refresh company fundamentals
        # Names, P/E, margins, etc. Same rule: a failed run leaves the last good file in place.
        continue-on-error: true
        run: |
          pip install -r requirements-refresh.txt
          python fundamentals.py

      - name: Commit refreshed data
        run: |
          if [ -n "$(git status --porcelain site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json site/sector_data.json site/news.json site/fundamentals.json
            git commit -m "Refresh price and news data"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
