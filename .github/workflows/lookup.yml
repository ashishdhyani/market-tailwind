name: Look up one stock

# Started from the app's Lookup tab. Fetches a full report for ONE symbol from Yahoo Finance and stores it as JSON on
# the `lookups` branch (never on main, so it does not redeploy the site). The page reads it from there.
# Anyone can see which symbols were looked up, because this repository is public.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol, e.g. SOFI, TSM, QQQM or D05.SI"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lookups
  cancel-in-progress: false   # queue lookups, never drop one

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-refresh.txt

      - run: pip install -r requirements-refresh.txt

      - name: Check the symbol
        env:
          SYMBOL: ${{ inputs.symbol }}     # passed through the environment, never pasted into the script
        shell: bash
        run: |
          SYMBOL="$(printf '%s' "$SYMBOL" | tr '[:lower:]' '[:upper:]')"
          # bash matches the WHOLE string (grep checks line by line, so a value with a newline could slip an extra line into $GITHUB_ENV)
          if [[ ! "$SYMBOL" =~ ^[A-Z0-9][A-Z0-9.-]{0,11}$ ]]; then
            echo "Not a valid ticker symbol." >&2; exit 1
          fi
          echo "SYMBOL=$SYMBOL" >> "$GITHUB_ENV"

      - name: Fetch the report
        run: python lookup.py "$SYMBOL" "$RUNNER_TEMP/result.json"

      - name: Publish to the lookups branch
        run: python tools/publish_lookup.py "$SYMBOL" "$RUNNER_TEMP/result.json"
